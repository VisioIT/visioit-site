name: Publicar na KingHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kinghost-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Gerar site estático
    runs-on: ubuntu-latest
    env:
      FTP_CONFIGURED: ${{ secrets.KINGHOST_FTP_HOST != '' && secrets.KINGHOST_FTP_USER != '' && secrets.KINGHOST_FTP_PASSWORD != '' }}

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Preparar o pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar o site
        run: pnpm build

      - name: Instalar cliente FTP
        if: ${{ env.FTP_CONFIGURED == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Enviar para a KingHost por FTP
        if: ${{ env.FTP_CONFIGURED == 'true' }}
        env:
          FTP_HOST: ${{ secrets.KINGHOST_FTP_HOST }}
          FTP_USER: ${{ secrets.KINGHOST_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.KINGHOST_FTP_PORT }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_HOST" -e "
            set net:max-retries 3;
            set net:timeout 20;
            set ftp:passive-mode true;
            set ftp:ssl-allow true;
            # KingHost's FTP TLS certificate is not chained to a public CA.
            # Keep TLS enabled while allowing that hosting certificate.
            set ssl:verify-certificate no;
            debug 2;
            pwd;
            cls -la;
            # This KingHost FTP user opens directly in the site's public directory
            # and the server does not expose absolute remote paths.
            mirror --reverse --parallel=1 --verbose=1 dist/client/ .;
            bye
          "

      - name: Preparar os arquivos públicos
        run: |
          mkdir -p "$RUNNER_TEMP/visioit-public"
          cp -R dist/client/. "$RUNNER_TEMP/visioit-public/"

      - name: Publicar na branch master
        env:
          PUBLIC_DIR: ${{ runner.temp }}/visioit-public
        run: |
          git config user.name "Visio IT Deploy"
          git config user.email "deploy@visioit.com.br"
          git fetch origin master || true
          if git show-ref --verify --quiet refs/remotes/origin/master; then
            git switch --create master --track origin/master
          else
            git switch --orphan master
          fi
          git rm -rf . || true
          # The build installs dependencies as untracked files. Clear the
          # ephemeral runner before copying only the public static output.
          git clean -fdx
          cp -R "$PUBLIC_DIR"/. .
          git add --all
          git commit --allow-empty -m "Publicação ${GITHUB_SHA::7}"
          git push origin master
