name: Publicar na KingHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kinghost-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Gerar site estático
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Preparar o pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar o site
        run: pnpm build

      - name: Preparar os arquivos públicos
        run: |
          mkdir -p "$RUNNER_TEMP/visioit-public"
          cp -R dist/client/. "$RUNNER_TEMP/visioit-public/"

      - name: Publicar na branch master
        env:
          PUBLIC_DIR: ${{ runner.temp }}/visioit-public
        run: |
          git config user.name "Visio IT Deploy"
          git config user.email "deploy@visioit.com.br"
          git fetch origin master || true
          if git show-ref --verify --quiet refs/remotes/origin/master; then
            git switch --create master --track origin/master
          else
            git switch --orphan master
          fi
          git rm -rf . || true
          # The build installs dependencies as untracked files. Clear the
          # ephemeral runner before copying only the public static output.
          git clean -fdx
          cp -R "$PUBLIC_DIR"/. .
          git add --all
          git commit --allow-empty -m "Publicação ${GITHUB_SHA::7}"
          git push origin master

      - name: Aguardar sincronização da KingHost
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}
        env:
          EXPECTED_INDEX: ${{ runner.temp }}/visioit-public/index.html
        run: |
          expected_hash="$(sha256sum "$EXPECTED_INDEX" | cut -d ' ' -f 1)"
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error \
              --header "Cache-Control: no-cache" \
              --output "$RUNNER_TEMP/live-index.html" \
              "https://visioit.com.br/?deploy=${GITHUB_SHA}"
            live_hash="$(sha256sum "$RUNNER_TEMP/live-index.html" | cut -d ' ' -f 1)"
            if [ "$live_hash" = "$expected_hash" ]; then
              echo "A nova versão já está ativa na KingHost."
              exit 0
            fi
            echo "Aguardando a KingHost sincronizar (${attempt}/20)..."
            sleep 15
          done
          echo "A KingHost não confirmou a nova versão dentro de 5 minutos."
          exit 1

      - name: Limpar cache da Cloudflare
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          response="$(curl --fail --silent --show-error \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          echo "$response" | jq --exit-status '.success == true' > /dev/null
          echo "Cache da Cloudflare limpo com sucesso."
